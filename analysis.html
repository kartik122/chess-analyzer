<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Chess Analyzer</title>
  <link rel="stylesheet" href="vendor/chessground/chessground.base.css" />
  <link rel="stylesheet" href="vendor/chessground/chessground.brown.css" />
  <link rel="stylesheet" href="vendor/chessground/chessground.cburnett.css" />
  <link rel="stylesheet" href="analysis.css" />
</head>
<body>
  <div id="app">
    <div id="board-column">
      <div id="board-row">
        <div id="eval-bar" title="Evaluation">
          <div id="eval-bar-fill"></div>
        </div>
        <div id="board-wrap"><div id="board" class="cg-wrap"></div></div>
      </div>
      <div id="controls">
        <button id="btn-first" title="Start of game">|&lt;</button>
        <button id="btn-prev" title="Back one move">&lt;</button>
        <button id="btn-next" title="Forward one move">&gt;</button>
        <button id="btn-last" title="End of main line">&gt;|</button>
        <span id="result-text"></span>
      </div>
    </div>
    <div id="side-column">
      <div id="side-heading">Engine</div>
      <div id="engine-lines">Loading game…</div>
      <div id="side-heading">Moves</div>
      <div id="move-tree"></div>
    </div>
  </div>
  <script type="module" src="analysis.js"></script>
</body>
</html>
